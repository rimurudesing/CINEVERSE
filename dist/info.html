  <style>
    /* ── Estilos locales de info.html ─── */
    body {
      min-height: 100vh;
      background: var(--bg-void);
    }

    /* Hero backdrop */
    .info-hero {
      position: relative;
      width: 100%;
      min-height: 55vh;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      display: flex;
      align-items: flex-end;
    }

    .info-hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(7, 7, 10, 0.3) 0%,
        rgba(7, 7, 10, 0.6) 50%,
        rgba(7, 7, 10, 1) 100%
      );
    }

    .info-hero__content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 3rem 2rem 2rem;
    }

    /* Tarjeta principal de info */
    .info-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    /* Layout de 2 columnas en desktop */
    .info-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
    }

    /* Sidebar izquierda */
    .info-sidebar {
      background: var(--bg-secondary);
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .info-poster {
      width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-red);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      display: block;
    }

    /* Columna derecha principal */
    .info-main {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      overflow: hidden;
    }

    /* Título */
    .info-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .info-tagline {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--accent-red);
      font-size: clamp(0.95rem, 2vw, 1.25rem);
    }

    /* Meta chips */
    .info-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .info-meta-row strong {
      color: var(--text-primary);
    }

    /* Géneros */
    .info-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Sinopsis */
    .info-section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .info-overview {
      font-family: var(--font-body);
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Rating ring section */
    .info-rating-block {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Reparto: grid de tarjetas */
    .cast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 1.25rem;
    }

    .cast-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .cast-card:hover {
      transform: translateY(-3px);
    }

    .cast-card img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-subtle);
      transition: border-color 0.2s;
    }

    .cast-card:hover img {
      border-color: var(--accent-red);
    }

    .cast-card__name {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .cast-card__role {
      font-size: 0.72rem;
      color: var(--text-secondary);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    /* Tabla de Equipo */
    .crew-table {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }

    .crew-item h4 {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .crew-item p {
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Proveedores */
    .providers-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .provider-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .provider-chip img {
      width: 22px;
      height: 22px;
      border-radius: 4px;
    }

    /* Botones de acción en sidebar */
    .info-sidebar-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      margin-top: 1.25rem;
    }

    .action-btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.95rem 1.2rem;
      background: linear-gradient(135deg, var(--accent-red) 0%, #c1121f 100%);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(229, 9, 20, 0.38), 0 1px 0 rgba(255, 255, 255, 0.15) inset;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn-primary:hover {
      background: linear-gradient(135deg, #ff2d2d 0%, var(--accent-red) 100%);
      box-shadow: 0 6px 25px rgba(229, 9, 20, 0.55), 0 1px 0 rgba(255, 255, 255, 0.2) inset;
      transform: translateY(-2px);
    }

    .action-btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.3);
    }

    .action-btn-trailer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn-trailer:hover {
      background: rgba(229, 9, 20, 0.12);
      border-color: var(--border-red);
      color: var(--text-primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.18);
    }

    .action-btn-trailer:active {
      transform: translateY(0);
    }

    .action-btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      box-sizing: border-box;
    }

    .action-btn-secondary:hover {
      background: var(--bg-overlay);
      color: var(--text-primary);
      border-color: var(--border-medium);
      transform: translateY(-1px);
    }

    .action-btn-secondary:active {
      transform: translateY(0);
    }

    .action-btn-secondary.is-active {
      background: rgba(229, 9, 20, 0.15) !important;
      color: #ffffff !important;
      border-color: rgba(229, 9, 20, 0.5) !important;
      box-shadow: 0 0 14px rgba(229, 9, 20, 0.2);
    }

    .action-btn-secondary.is-active#btn-watched {
      background: rgba(34, 197, 94, 0.15) !important;
      color: #4ade80 !important;
      border-color: rgba(34, 197, 94, 0.5) !important;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.18);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-family: var(--font-ui);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0.5rem 0;
      transition: color 0.2s;
      margin-bottom: 1.5rem;
    }

    .back-btn:hover { color: var(--text-primary); }

    /* Skeleton loader */
    .info-skeleton {
      padding: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .info-layout {
        grid-template-columns: 1fr;
      }

      .info-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 1.5rem;
      }

      .info-poster-wrap {
        width: 160px;
        flex-shrink: 0;
      }

      .info-sidebar-actions {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
    }

    @media (max-width: 600px) {
      .info-hero { min-height: 35vh; }

      .info-sidebar {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .info-poster-wrap {
        width: 140px;
      }

      .info-sidebar-actions {
        width: 100%;
      }

      .info-main {
        padding: 1.5rem;
        gap: 1.5rem;
      }

      .cast-grid {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 1rem;
      }

      .crew-table {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Transición de página -->
  <div class="page-transition-overlay out"></div>

  <!-- Hero Backdrop -->
  <div class="info-hero" id="info-hero-root">
    <div class="info-hero__overlay"></div>
    <div class="info-hero__content">
      <!-- Vacío — el contenido está debajo -->
    </div>
  </div>

  <!-- Contenido principal -->
  <main class="container" style="margin-top: -80px; position: relative; z-index: 10; padding-bottom: 4rem;">

    <!-- Botón Volver -->
    <button class="back-btn" id="back-btn" onclick="history.back()">
      ← Volver
    </button>

    <!-- Skeleton loader temporal -->
    <div id="info-root">
      <div class="info-skeleton">
        <div class="skeleton" style="height: 30px; width: 40%; border-radius: var(--radius-md);"></div>
        <div class="skeleton" style="height: 20px; width: 60%; border-radius: var(--radius-md);"></div>
        <div class="skeleton" style="height: 180px; border-radius: var(--radius-md);"></div>
        <div class="skeleton" style="height: 120px; border-radius: var(--radius-md);"></div>
      </div>
    </div>

    <!-- Anuncio Adsterra — Inferior -->
    <div class="adsterra-banner adsterra-banner--desktop" style="margin-top: 3rem;"></div>
    <div class="adsterra-banner adsterra-banner--mobile" style="margin-top: 3rem;"></div>

  </main>


  <script type="module" src="js/pages/info.js?v=3.1.7"></script>
  <script type="module" src="js/ads-helper.js?v=3.1.7"></script>
  <!-- Chat en Vivo en Tiempo Real -->
  <script src="js/pwa-extras.js"></script>
</body>
