<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Icono y Favicon de la Web -->
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e50914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineVerse">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CineVerse — Reproductor</title>
  <meta name="description" content="Reproduce películas y series directamente en CineVerse con el mejor reproductor online.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/variables.css?v=3.0.2">
  <link rel="stylesheet" href="css/reset.css?v=3.0.2">
  <link rel="stylesheet" href="css/layout.css?v=3.0.2">
  <link rel="stylesheet" href="css/components.css?v=3.0.2">
  <link rel="stylesheet" href="css/navbar.css?v=3.0.2">
  <link rel="stylesheet" href="css/hero.css?v=3.0.2">
  <link rel="stylesheet" href="css/carousel.css?v=3.0.2">
  <link rel="stylesheet" href="css/modal.css?v=3.0.2">
  <link rel="stylesheet" href="css/skeleton.css?v=3.0.2">
  <link rel="stylesheet" href="css/forms.css?v=3.0.2">
  <link rel="stylesheet" href="css/animations.css?v=3.0.2">
  <link rel="stylesheet" href="css/responsive.css?v=3.0.2">
  <link rel="stylesheet" href="css/ads.css?v=3.0.2">

  <style>
    /* ── Watch Page Layout ─────────────────────────────────────────────────── */
    :root {
      --player-sidebar-width: 340px;
      --player-gap: 2rem;
    }

    body {
      padding-top: 70px;
      background: var(--bg-void);
    }

    /* ── Quitar el borde rojo en focus de SELECTS e INPUTS ──────────────────── */
    select:focus,
    select:focus-visible,
    input:focus,
    input:focus-visible,
    textarea:focus,
    textarea:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.12) !important;
      border-color: rgba(255,255,255,0.25) !important;
    }

    /* Contenedor principal */
    .watch-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem clamp(0.75rem, 3vw, 2rem) 4rem;
    }

    /* Layout 2 columnas (desktop) */
    .watch-layout {
      display: grid;
      grid-template-columns: 1fr var(--player-sidebar-width);
      gap: var(--player-gap);
      align-items: flex-start;
    }

    /* Columna del player */
    .watch-main {
      min-width: 0;
    }

    /* Meta box debajo del player */
    .watch-meta-box {
      margin-top: 1.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: clamp(1rem, 3vw, 1.75rem);
    }

    .watch-meta-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    #watch-meta-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    /* Sidebar */
    .watch-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .watch-sidebar-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .watch-sidebar-card h3 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-red);
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* ── Responsive: Tablet ──────────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      :root { --player-sidebar-width: 290px; --player-gap: 1.25rem; }
    }

    @media (max-width: 900px) {
      .watch-layout {
        grid-template-columns: 1fr;
      }
      .watch-sidebar {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .watch-sidebar-card {
        flex: 1 1 280px;
      }
    }

    /* ── Responsive: Móvil ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      body { padding-top: 60px; }
      .watch-container { padding: 0.75rem 0.75rem 3rem; }
      .watch-layout { gap: 1rem; }
      .watch-sidebar { flex-direction: column; }
      .watch-sidebar-card { flex: unset; }

      #watch-meta-title { font-size: 1.2rem; }

      /* Player de borde a borde en móvil */
      #player-area-root {
        margin: 0 -0.75rem;
        border-radius: 0 !important;
      }
    }

    /* ── TV / Big Screen: 1280px+ ────────────────────────────────────────────── */
    @media (min-width: 1400px) {
      :root { --player-sidebar-width: 380px; }
    }

    @media (min-width: 1800px) {
      :root { --player-sidebar-width: 420px; }
      .watch-container { padding: 2rem 3rem 5rem; }
    }

    /* ── Foco para navegación con teclado / TV D-Pad ────────────────────────── */
    /* Solo botones y links se iluminan con foco */
    .btn:focus-visible,
    a:focus-visible {
      outline: 2.5px solid rgba(229,9,20,0.7) !important;
      outline-offset: 2px !important;
      border-radius: 6px;
    }

    /* Selects: foco discreto sin borde rojo */
    select:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15) !important;
    }

    /* ── Anuncios ────────────────────────────────────────────────────────────── */
    .adsterra-banner { width: 100%; margin-bottom: 1rem; text-align: center; }
    @media (max-width: 600px) {
      .adsterra-banner--desktop { display: none; }
    }
    @media (min-width: 601px) {
      .adsterra-banner--mobile { display: none; }
    }

    /* ── Barra de Servidores del Reproductor (Vimeus & VidLink) ── */
    .player-servers-header {
      display: flex;
      align-items: center;
      background: #141518;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      user-select: none;
    }
    .player-servers-header::-webkit-scrollbar {
      display: none;
    }
    .player-servers-list {
      display: flex;
      align-items: stretch;
      flex-wrap: nowrap;
    }
    .server-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background: #1a1c22;
      color: #9ca3af;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .server-tab:hover {
      background: #262932;
      color: #ffffff;
    }
    .server-tab.active {
      background: #0b0c0e;
      color: #ffffff;
      box-shadow: inset 0 2px 0 0 var(--accent-red);
    }
    .server-tab .server-icon {
      font-size: 0.95rem;
    }
    .server-tab-badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: rgba(229, 9, 20, 0.2);
      color: #ff4d4d;
      font-weight: 800;
    }

    /* ── Selectores Estilizados de Alta Gama (Temporadas & Episodios) ── */
    .custom-select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 1;
      min-width: 140px;
      max-width: 220px;
    }
    .custom-select-wrapper::after {
      content: '';
      position: absolute;
      right: 1.1rem;
      pointer-events: none;
      width: 8px;
      height: 8px;
      border-right: 2px solid #9ca3af;
      border-bottom: 2px solid #9ca3af;
      transform: translateY(-2px) rotate(45deg);
      transition: transform 200ms cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 200ms ease;
    }
    .custom-select-wrapper:focus-within::after {
      border-color: var(--accent-red);
      transform: translateY(2px) rotate(-135deg);
    }
    .custom-dropdown-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      background: rgba(18, 20, 26, 0.85) !important;
      color: #f3f4f6 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.09) !important;
      border-radius: var(--radius-md) !important;
      padding: 0.65rem 2.4rem 0.65rem 1.1rem !important;
      font-family: var(--font-ui) !important;
      font-size: 0.88rem !important;
      font-weight: 600 !important;
      line-height: 1.4 !important;
      min-height: 44px !important;
      cursor: pointer !important;
      outline: none !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
      transition: all 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    }
    .custom-dropdown-select:hover {
      background: rgba(26, 29, 38, 0.95) !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
      transform: translateY(-1px);
    }
    .custom-dropdown-select:focus {
      border-color: var(--accent-red) !important;
      background: #0f1015 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(229, 9, 20, 0.15) !important;
    }
    .custom-dropdown-select option {
      background: #14161f;
      color: #ffffff;
      padding: 10px;
      font-weight: 500;
    }

    /* ── Menú Desplegable Cinemático Personalizado ── */
    .cine-select-container {
      position: relative;
      flex: 1;
      min-width: 140px;
      max-width: 220px;
      user-select: none;
    }
    .cine-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
      background: #12141a;
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 0.65rem 1rem;
      font-family: var(--font-ui);
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 44px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .cine-select-trigger:hover {
      background: #181b24;
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    .cine-select-container.open .cine-select-trigger {
      border-color: var(--accent-red);
      background: #0d0f14;
    }
    .cine-select-arrow {
      width: 8px;
      height: 8px;
      border-right: 2px solid #9ca3af;
      border-bottom: 2px solid #9ca3af;
      transform: translateY(-2px) rotate(45deg);
      transition: transform 200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .cine-select-container.open .cine-select-arrow {
      transform: translateY(2px) rotate(-135deg);
      border-color: var(--accent-red);
    }
    .cine-select-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #11131a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      padding: 0.35rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
      animation: dropdownIn 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .cine-select-container.open .cine-select-menu {
      display: block;
    }
    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cine-select-option {
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 0.84rem;
      font-weight: 500;
      color: #9ca3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 120ms ease;
    }
    .cine-select-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      transform: translateX(2px);
    }
    .cine-select-option.selected {
      background: rgba(229, 9, 20, 0.15);
      color: #ffffff;
      font-weight: 700;
    }
    .cine-select-option.selected::after {
      content: '✓';
      color: var(--accent-red);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Transición de página -->
  <div class="page-transition-overlay out"></div>

  <!-- Contenido Principal -->
  <main class="watch-container">

    <!-- Anuncio Superior -->
    <div class="adsterra-banner adsterra-banner--desktop"></div>
    <div class="adsterra-banner adsterra-banner--mobile"></div>

    <div class="watch-layout">

      <!-- ══ Columna Principal: Player ══ -->
      <section class="watch-main">

        <!-- Player root — JS inyecta el iframe de Vimeus aquí -->
        <div id="player-area-root">
          <div style="
            aspect-ratio: 16/9;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-subtle);
          ">
            <div class="spinner"></div>
          </div>
        </div>

        <!-- Meta información -->
        <div class="watch-meta-box">
          <div class="watch-meta-header">
            <div style="flex:1;min-width:0;">
              <h1 id="watch-meta-title">Cargando...</h1>
              <span id="watch-meta-year" style="font-size:0.9rem;color:var(--text-secondary);font-family:var(--font-mono);"></span>
            </div>
            <span id="watch-meta-rating" style="
              font-family: var(--font-display);
              font-size: clamp(1.2rem, 2.5vw, 1.5rem);
              color: var(--gold);
              white-space: nowrap;
              flex-shrink: 0;
            ">★ —</span>
          </div>
          <p id="watch-meta-overview" style="
            font-family: var(--font-body);
            font-size: clamp(0.92rem, 1.5vw, 1.05rem);
            color: var(--text-secondary);
            line-height: 1.65;
          "></p>
          <a id="watch-more-info-link" href="#" class="btn btn--outline-red"
             tabindex="0" role="button" aria-label="Más información"
             style="margin-top:1.25rem;display:inline-flex;width:fit-content;text-decoration:none;">
            ℹ️ Más información
          </a>
        </div>
      </section>

      <!-- ══ Sidebar ══ -->
      <aside class="watch-sidebar">

        <!-- Plataformas de Streaming -->
        <div class="watch-sidebar-card">
          <h3>¿Dónde Ver?</h3>
          <div id="watch-providers-container">
            <div class="skeleton" style="height:20px;border-radius:var(--radius-sm);margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:20px;border-radius:var(--radius-sm);width:80%;"></div>
          </div>
        </div>

        <!-- Reparto Principal -->
        <div class="watch-sidebar-card">
          <h3>Reparto Principal</h3>
          <div id="watch-cast-list">
            <div class="skeleton" style="height:40px;border-radius:var(--radius-sm);margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:40px;border-radius:var(--radius-sm);margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:40px;border-radius:var(--radius-sm);"></div>
          </div>
        </div>

      </aside>

    </div>

    <!-- Anuncio Inferior -->
    <div class="adsterra-banner adsterra-banner--desktop" style="margin-top:1.5rem;"></div>
    <div class="adsterra-banner adsterra-banner--mobile" style="margin-top:1.5rem;"></div>

  </main>

  <script type="module" src="js/pages/watch.js?v=3.0.2"></script>
  <script type="module" src="js/ads-helper.js?v=3.0.2"></script>
  <script src="js/pwa-extras.js"></script>
</body>
</html>
