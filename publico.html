<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <script>(function(){try{var t=localStorage.getItem('cineverse_theme_mode')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <!-- Icono y Favicon de la Web -->
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Público — CineVerse</title>
  <meta name="description" content="Mira las películas favoritas, historial y reseñas de este usuario en CineVerse.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/variables.css?v=3.0.0">
  <link rel="stylesheet" href="css/reset.css?v=3.0.0">
  <link rel="stylesheet" href="css/layout.css?v=3.0.0">
  <link rel="stylesheet" href="css/components.css?v=3.0.0">
  <link rel="stylesheet" href="css/navbar.css?v=3.0.0">
  <link rel="stylesheet" href="css/animations.css?v=3.0.0">
  <link rel="stylesheet" href="css/responsive.css?v=3.0.0">

  <style>
    body {
      background-color: var(--bg-void);
      padding-top: 100px;
    }

    .public-banner {
      height: 220px;
      border-radius: var(--radius-lg);
      border: none !important; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: -50px;
      box-shadow: var(--shadow-card);
    }

    .public-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 1.5rem;
      margin-bottom: 3rem;
    }

    .public-avatar-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .public-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-void);
      background-color: var(--bg-primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .public-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: linear-gradient(135deg, #F5C518, #b38f00);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.5rem;
      box-shadow: 0 4px 12px rgba(245,197,24,0.3);
    }

    .public-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
      max-width: 650px;
      width: 100%;
      margin: 2rem 0;
    }

    .public-stat-card {
      background: var(--bg-secondary);
      border: none !important; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .public-stat-card:hover {
      border-color: var(--accent-red);
    }

    .public-stat-num {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .public-stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .public-section {
      background: var(--bg-secondary);
      border: none !important; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-card);
    }

    .public-section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Transición de página -->
  <div class="page-transition-overlay out"></div>

  <main class="container" style="max-width: 850px; padding-bottom: 5rem;">

    <!-- Cargando State -->
    <div id="public-loader" style="text-align: center; padding: 6rem 0;">
      <div style="margin-bottom: 1rem; animation: pulse 1.5s infinite; display:flex; justify-content:center;"><svg class="iconly-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
      <h3 style="font-size: 1.25rem; color: var(--text-secondary);">Buscando perfil...</h3>
    </div>

    <!-- Error State -->
    <div id="public-error" style="display: none; text-align: center; padding: 6rem 0;">
      <div style="margin-bottom: 1rem; display:flex; justify-content:center;"><svg class="iconly-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/></svg></div>
      <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Usuario no encontrado</h3>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">El enlace de perfil público puede ser incorrecto o el usuario no existe.</p>
      <a href="index.html" class="btn btn--primary">Volver al Inicio</a>
    </div>

    <!-- Perfil Contenido -->
    <div id="public-profile-content" style="display: none;">
      
      <!-- Banner de Portada -->
      <div class="public-banner" id="public-banner"></div>

      <!-- Héroe del Perfil -->
      <div class="public-hero">
        <div class="public-avatar-wrap">
          <img src="" alt="" class="public-avatar" id="public-avatar">
        </div>
        <h1 style="font-size: 2.25rem; font-weight: 800; color: #fff;" id="public-name">Cargando...</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem; font-family: var(--font-mono); font-size: 0.88rem;" id="public-username">@username</p>
        
        <span class="public-badge" id="public-premium-badge" style="display: none;"><svg class="iconly-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z"/></svg> <span>Mecenas VIP</span></span>
        <span id="public-user-title" style="display: inline-block; font-size: 0.85rem; font-weight: 700; color: var(--accent-red); margin-top: 0.4rem; padding: 0.2rem 0.6rem; background: rgba(229,9,20,0.1); border-radius: var(--radius-sm); border: 1px solid rgba(229,9,20,0.25);"></span>
        
        <p style="color: var(--text-secondary); max-width: 500px; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5;" id="public-bio"></p>

        <!-- Estadísticas -->
        <div class="public-stats-grid">
          <div class="public-stat-card">
            <div class="public-stat-num" id="stat-vistos">0</div>
            <div class="public-stat-label">Vistos</div>
          </div>
          <div class="public-stat-card">
            <div class="public-stat-num" id="stat-favs">0</div>
            <div class="public-stat-label">Favoritos</div>
          </div>
          <div class="public-stat-card">
            <div class="public-stat-num" id="stat-reviews">0</div>
            <div class="public-stat-label">Reseñas</div>
          </div>
          <div class="public-stat-card">
            <div class="public-stat-num" id="stat-followers">0</div>
            <div class="public-stat-label">Seguidores</div>
          </div>
          <div class="public-stat-card">
            <div class="public-stat-num" id="stat-following">0</div>
            <div class="public-stat-label">Siguiendo</div>
          </div>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap;">
          <button class="btn btn--primary" id="btn-follow" style="display: none; padding: 0.6rem 2rem; font-weight: 700;">
             Seguir
          </button>
          <button class="btn btn--secondary" id="btn-share-profile" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.5rem;">
            <svg class="iconly-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> <span>Compartir</span>
          </button>
        </div>
      </div>

      <!-- Reseña Anclada -->
      <div class="public-section" id="public-section-pinned" style="display: none;">
        <h3 class="public-section-title"><svg class="iconly-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/></svg> <span>Crítica Destacada</span></h3>
        <div id="pinned-review-container"></div>
      </div>

      <!-- Favoritos Recientes -->
      <div class="public-section">
        <h3 class="public-section-title"><svg class="iconly-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <span>Favoritos</span></h3>
        <div class="grid grid--3" id="public-favorites-grid"></div>
      </div>

      <!-- Historial de Visualización -->
      <div class="public-section">
        <h3 class="public-section-title"><svg class="iconly-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> <span>Visto Recientemente</span></h3>
        <div class="grid grid--3" id="public-history-grid"></div>
      </div>

    </div>

  </main>

  <script type="module" src="js/pages/publico.js?v=3.0.0"></script>
  <script type="module" src="js/ads-helper.js?v=3.0.0"></script>
</body>
</html>
