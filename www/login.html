<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Icono y Favicon de la Web -->
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse — Iniciar Sesión o Registrarse</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/variables.css?v=3.0.0">
  <link rel="stylesheet" href="css/reset.css?v=3.0.0">
  <link rel="stylesheet" href="css/layout.css?v=3.0.0">
  <link rel="stylesheet" href="css/components.css?v=3.0.0">
  <link rel="stylesheet" href="css/navbar.css?v=3.0.0">
  <link rel="stylesheet" href="css/hero.css?v=3.0.0">
  <link rel="stylesheet" href="css/carousel.css?v=3.0.0">
  <link rel="stylesheet" href="css/modal.css?v=3.0.0">
  <link rel="stylesheet" href="css/skeleton.css?v=3.0.0">
  <link rel="stylesheet" href="css/forms.css?v=3.0.0">
  <link rel="stylesheet" href="css/animations.css?v=3.0.0">
  <link rel="stylesheet" href="css/responsive.css?v=3.0.0">


  <style>
    /* Estilos específicos para la página de login (Fondo completo y panel glass) */
    .login-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-void);
      padding: 2rem 1rem;
    }
    
    .login-bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(16px) brightness(0.28);
      transform: scale(1.08);
      z-index: 1;
      transition: background-image 0.8s ease-in-out;
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(229, 9, 20, 0.12) 0%, rgba(5, 5, 8, 0.88) 75%);
      z-index: 2;
    }

    .login-back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      background: rgba(14, 15, 18, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all var(--transition-med);
    }

    .login-back-btn:hover {
      background: rgba(229, 9, 20, 0.15);
      border-color: rgba(229, 9, 20, 0.4);
      color: #fff;
      transform: translateX(-3px);
    }

    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: rgba(12, 13, 16, 0.82);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(229, 9, 20, 0.15), 0 1px 0 rgba(255,255,255,0.08) inset;
      font-family: var(--font-ui);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
        border-radius: var(--radius-lg);
      }
      .login-back-btn {
        top: 1rem;
        left: 1rem;
        font-size: 0.8rem;
        padding: 0.45rem 0.85rem;
      }
    }

    .auth-tab-btn {
      background: none;
      border: none;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .auth-tab-btn:hover {
      color: #fff;
    }

    .auth-tab-btn.active {
      color: var(--accent-red);
      background: rgba(229, 9, 20, 0.1);
    }

    .auth-form {
      display: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--transition-med) ease, transform var(--transition-med) ease;
    }

    .auth-form.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translateY(0);
    }

    /* ═══ CAMPOS DE ERROR INLINE ═══ */
    .field-error {
      font-family: var(--font-ui);
      font-size: 0.78rem;
      color: #ff4d4d;
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 1.1rem;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }

    .field-error.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .field-error.field-success {
      color: #22c55e;
    }

    .form-input.input-error {
      border-color: #ff4d4d !important;
      box-shadow: 0 0 0 3px rgba(255, 77, 77, 0.18);
    }

    .form-input.input-success {
      border-color: #22c55e !important;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .shake { animation: shake 0.35s ease; }

    /* Wrapper para input + icono ojo */
    .input-wrapper {
      position: relative;
    }

    .input-wrapper .form-input {
      padding-right: 2.8rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color 0.2s ease;
      font-size: 1rem;
    }

    .toggle-password:hover { color: var(--text-primary); }

    /* Barra de fortaleza de contraseña */
    .password-strength-bar {
      display: flex;
      gap: 5px;
      margin-top: 0.45rem;
    }

    .strength-segment {
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.3s ease;
    }

    .strength-segment.weak   { background: #ff4d4d; }
    .strength-segment.fair   { background: #facc15; }
    .strength-segment.good   { background: #22c55e; }
    .strength-segment.strong { background: #10b981; }

    .password-strength-label {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      margin-top: 0.25rem;
      min-height: 1rem;
      transition: color 0.3s ease;
    }

    /* Mensaje de éxito global en el formulario */
    .form-alert {
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-family: var(--font-ui);
      font-size: 0.84rem;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .form-alert.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .form-alert.alert-error {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #ff9999;
    }

    .form-alert.alert-success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .form-alert.alert-info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <!-- Transición de página roja -->
  <div class="page-transition-overlay out"></div>

  <div class="login-container">
    <!-- Fondo de película dinámico con viñeta ambiental -->
    <div class="login-bg" id="login-bg"></div>
    <div class="login-overlay"></div>

    <!-- Botón Volver a Inicio Flotante -->
    <a href="index.html" class="login-back-btn" aria-label="Volver al Inicio" title="Volver al inicio">
      <span>←</span> Volver a CineVerse
    </a>

    <!-- Panel de login con glassmorphism ultra-pulido -->
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <a href="index.html" style="text-decoration: none; display: inline-block;">
          <h1 style="font-family: var(--font-display); font-size: 3.2rem; letter-spacing: 2px; line-height: 1; margin-bottom: 0.35rem; color: #fff;">
            CINE<span style="color: var(--accent-red); text-shadow: 0 0 25px rgba(229,9,20,0.6);">VERSE</span>
          </h1>
        </a>
        <p style="color: var(--text-secondary); font-size: 0.88rem; letter-spacing: 0.3px;">Tu portal definitivo de películas y series</p>
      </div>

      <!-- Tabs de Control con microindicador -->
      <div class="flex flex--justify-between auth-tabs-bar" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem; margin-bottom: 1.75rem;">
        <button class="auth-tab-btn active" data-form="login">Entrar</button>
        <button class="auth-tab-btn" data-form="register">Registrarse</button>
        <button class="auth-tab-btn" data-form="recover">Recuperar</button>
      </div>

      <!-- Formulario 1: Login -->
      <form id="form-login" class="auth-form active flex flex--col flex--gap-md">
        <!-- Alerta de error general del formulario -->
        <div id="login-alert" class="form-alert" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" class="form-input" placeholder="ejemplo@correo.com"
            autocomplete="email" spellcheck="false" autocapitalize="none" required>
          <div id="login-email-error" class="field-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••"
              autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="login-password" aria-label="Mostrar contraseña" tabindex="-1">
              👁️
            </button>
          </div>
          <div id="login-password-error" class="field-error" role="alert"></div>
          <div style="display: flex; justify-content: flex-end; margin-top: 0.35rem;">
            <a href="#" id="login-forgot-link" style="font-size:0.8rem; color:var(--text-secondary); text-decoration: none; transition:color 0.2s;" onmouseover="this.style.color='var(--accent-red)'" onmouseout="this.style.color='var(--text-secondary)'">¿Olvidaste tu contraseña?</a>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn--primary" style="margin-top: 0.75rem; width: 100%; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 700;">
          Iniciar Sesión
        </button>
      </form>

      <!-- Formulario 2: Registro -->
      <form id="form-register" class="auth-form flex flex--col flex--gap-md">
        <!-- Alerta general de registro -->
        <div id="register-alert" class="form-alert" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="register-username">Nombre de Usuario</label>
          <input type="text" id="register-username" class="form-input" placeholder="tu_usuario"
            autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <div id="register-username-error" class="field-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Correo Electrónico</label>
          <input type="email" id="register-email" class="form-input" placeholder="tu_correo@ejemplo.com"
            autocomplete="email" spellcheck="false" autocapitalize="none" required>
          <div id="register-email-error" class="field-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="register-password" class="form-input" placeholder="Mínimo 6 caracteres"
              autocomplete="new-password" required>
            <button type="button" class="toggle-password" data-target="register-password" aria-label="Mostrar contraseña" tabindex="-1">
              👁️
            </button>
          </div>
          <!-- Barra de fortaleza -->
          <div class="password-strength-bar">
            <div class="strength-segment" id="seg-1"></div>
            <div class="strength-segment" id="seg-2"></div>
            <div class="strength-segment" id="seg-3"></div>
            <div class="strength-segment" id="seg-4"></div>
          </div>
          <div id="password-strength-label" class="password-strength-label" style="color: var(--text-muted);"></div>
          <div id="register-password-error" class="field-error" role="alert"></div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn--primary" style="margin-top: 0.75rem; width: 100%; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 700;">
          Crear Cuenta
        </button>
      </form>

      <!-- Formulario 3: Recuperar Contraseña -->
      <form id="form-recover" class="auth-form flex flex--col flex--gap-md">
        <p style="color: var(--text-secondary); font-size: 0.88rem; line-height: 1.5;">
          Ingresa el correo de tu cuenta y te enviaremos un enlace seguro para restablecer tu contraseña.
        </p>
        <!-- Alerta general de recuperación -->
        <div id="recover-alert" class="form-alert" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="recover-email">Correo Electrónico</label>
          <input type="email" id="recover-email" class="form-input" placeholder="ejemplo@correo.com"
            autocomplete="email" spellcheck="false" autocapitalize="none" required>
          <div id="recover-email-error" class="field-error" role="alert"></div>
        </div>

        <button type="submit" id="recover-submit-btn" class="btn btn--primary" style="margin-top: 0.75rem; width: 100%; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 700;">
          Enviar Enlace
        </button>
      </form>

    </div>
  </div>

  <script type="module" src="js/pages/login.js?v=3.0.0"></script>
</body>
</html>
